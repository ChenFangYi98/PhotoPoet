<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f7ff"/><stop offset="1" stop-color="#f8fcfb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#73849e"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:31px;font-weight:700;fill:#17263e}.sub{font-size:17px;fill:#6c7c93}.h{font-size:23px;font-weight:700;fill:#23334d}.p{font-size:17px;fill:#53657e}.small{font-size:15px;fill:#687b93}.arrow{stroke:#8798ae;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<text x="52" y="60" class="title">给语言模型加上视觉能力</text><text x="52" y="92" class="sub">图片先变成特征，再接入原有的语言模型</text>
<rect x="52" y="142" width="220" height="220" rx="22" fill="#fff" stroke="#dce6f4"/><rect x="76" y="168" width="172" height="105" rx="14" fill="#e6f4f3"/><circle cx="120" cy="199" r="16" fill="#f7c76e"/><path d="M88 255l40-40 22 19 20-25 61 46z" fill="#76bea9"/><text x="162" y="313" text-anchor="middle" class="h">输入图片</text><text x="162" y="340" text-anchor="middle" class="small">像素数字</text>
<rect x="330" y="142" width="220" height="220" rx="22" fill="#fff" stroke="#dce6f4"/><rect x="354" y="168" width="172" height="105" rx="14" fill="#e5edff"/><text x="440" y="211" text-anchor="middle" font-size="27" fill="#527ad8" font-weight="700">SigLIP</text><text x="440" y="239" text-anchor="middle" class="small">视觉编码器</text><text x="440" y="313" text-anchor="middle" class="h">提取视觉特征</text><text x="440" y="340" text-anchor="middle" class="small">默认每图 64 个向量</text>
<rect x="608" y="142" width="220" height="220" rx="22" fill="#fff" stroke="#dce6f4"/><rect x="632" y="168" width="172" height="105" rx="14" fill="#fff0db"/><text x="718" y="211" text-anchor="middle" font-size="26" fill="#cc863a" font-weight="700">Projector</text><text x="718" y="239" text-anchor="middle" class="small">可训练的投影器</text><text x="718" y="313" text-anchor="middle" class="h">调整特征</text><text x="718" y="340" text-anchor="middle" class="small">对齐语言模型的向量宽度</text>
<rect x="886" y="142" width="262" height="220" rx="22" fill="#fff" stroke="#dce6f4"/><rect x="910" y="168" width="214" height="105" rx="14" fill="#eee8ff"/><text x="1017" y="211" text-anchor="middle" font-size="26" fill="#7659c5" font-weight="700">MindChen LLM</text><text x="1017" y="239" text-anchor="middle" class="small">原有语言模型</text><text x="1017" y="313" text-anchor="middle" class="h">结合问题并回答</text><text x="1017" y="340" text-anchor="middle" class="small">逐个预测回答 token</text>
<path d="M274 251H320" class="arrow"/><path d="M552 251H598" class="arrow"/><path d="M830 251H876" class="arrow"/>
<rect x="52" y="409" width="1096" height="96" rx="18" fill="#eaf1ff"/><text x="80" y="446" class="h" font-size="20">问题文字也进入语言模型</text><text x="80" y="478" class="p">图片特征填入占位符的位置，与问题文字向量一起进入 Transformer。</text><path d="M1017 405V374" class="arrow"/>
</svg>
