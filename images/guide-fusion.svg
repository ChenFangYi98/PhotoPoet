<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8594ad"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#17263e}.sub{font-size:17px;fill:#708098}.label{font-size:20px;font-weight:700;fill:#34465f}.tiny{font-size:16px;fill:#526780}.blue{fill:#dce9ff;stroke:#a4bfec}.orange{fill:#ffeed6;stroke:#edc698}.purple{fill:#eee7ff;stroke:#c7b3ef}.t{font-size:17px;fill:#2d4669;font-weight:600}.arr{fill:none;stroke:#8b9bb1;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1200" height="580" rx="28" fill="#f8faff"/><text x="50" y="58" class="title">图片怎样进入语言模型的输入序列？</text><text x="50" y="91" class="sub">简化示意：图中画 4 个占位符；本项目默认每张图片使用 64 个</text>
<rect x="50" y="130" width="1100" height="105" rx="18" fill="#fff" stroke="#dfe7f4"/><text x="76" y="170" class="label">① 分词与词嵌入</text><text x="76" y="203" class="sub">先为图片保留连续位置</text>
<g transform="translate(392 153)"><rect width="96" height="52" rx="9" class="orange"/><text x="48" y="32" text-anchor="middle" class="t">用户</text><rect x="108" width="96" height="52" rx="9" class="blue"/><text x="156" y="32" text-anchor="middle" class="t">占位 1</text><rect x="216" width="96" height="52" rx="9" class="blue"/><text x="264" y="32" text-anchor="middle" class="t">占位 2</text><rect x="324" width="96" height="52" rx="9" class="blue"/><text x="372" y="32" text-anchor="middle" class="t">占位 3</text><rect x="432" width="96" height="52" rx="9" class="blue"/><text x="480" y="32" text-anchor="middle" class="t">占位 4</text><rect x="540" width="96" height="52" rx="9" class="orange"/><text x="588" y="32" text-anchor="middle" class="t">问题</text></g>
<rect x="50" y="257" width="1100" height="105" rx="18" fill="#fff" stroke="#dfe7f4"/><text x="76" y="297" class="label">② 图片特征</text><text x="76" y="330" class="sub">视觉编码器 → 投影器</text><g transform="translate(500 280)"><rect width="96" height="52" rx="9" class="purple"/><text x="48" y="32" text-anchor="middle" class="t">图像 1</text><rect x="108" width="96" height="52" rx="9" class="purple"/><text x="156" y="32" text-anchor="middle" class="t">图像 2</text><rect x="216" width="96" height="52" rx="9" class="purple"/><text x="264" y="32" text-anchor="middle" class="t">图像 3</text><rect x="324" width="96" height="52" rx="9" class="purple"/><text x="372" y="32" text-anchor="middle" class="t">图像 4</text></g>
<path d="M548 369V392" class="arr"/><path d="M656 369V392" class="arr"/><path d="M764 369V392" class="arr"/><path d="M872 369V392" class="arr"/>
<rect x="50" y="401" width="1100" height="105" rx="18" fill="#fff" stroke="#dfe7f4"/><text x="76" y="441" class="label">③ 替换向量</text><text x="76" y="474" class="sub">合并后交给语言模型</text><g transform="translate(392 424)"><rect width="96" height="52" rx="9" class="orange"/><text x="48" y="32" text-anchor="middle" class="t">用户</text><rect x="108" width="96" height="52" rx="9" class="purple"/><text x="156" y="32" text-anchor="middle" class="t">图像 1</text><rect x="216" width="96" height="52" rx="9" class="purple"/><text x="264" y="32" text-anchor="middle" class="t">图像 2</text><rect x="324" width="96" height="52" rx="9" class="purple"/><text x="372" y="32" text-anchor="middle" class="t">图像 3</text><rect x="432" width="96" height="52" rx="9" class="purple"/><text x="480" y="32" text-anchor="middle" class="t">图像 4</text><rect x="540" width="96" height="52" rx="9" class="orange"/><text x="588" y="32" text-anchor="middle" class="t">问题</text></g><text x="52" y="546" class="sub">注意：替换的是嵌入向量，不是把图片写成文字，也不是修改原始 token ID。</text>
</svg>
