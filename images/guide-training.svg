<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8998ae"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}.title{font-size:30px;font-weight:700;fill:#17263e}.sub{font-size:17px;fill:#6b7d95}.h{font-size:23px;font-weight:700;fill:#2f405b}.p{font-size:18px;fill:#52657e}.b{font-size:16px;font-weight:700}.arr{stroke:#8b9bb1;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1200" height="500" rx="28" fill="#f8faff"/><text x="52" y="62" class="title">训练：让图片特征逐渐与语言模型配合</text><text x="52" y="94" class="sub">以项目默认冻结策略为例；圆点表示对应参数是否更新</text>
<rect x="52" y="130" width="510" height="230" rx="22" fill="#fff" stroke="#dce6f4"/><rect x="52" y="130" width="510" height="56" rx="22" fill="#e8efff"/><text x="78" y="167" class="h">阶段 1 · 图文预训练</text><text x="78" y="219" class="p">学习让视觉投影器连接图像与语言</text><circle cx="88" cy="259" r="7" fill="#adb9c9"/><text x="107" y="265" class="p">视觉编码器：冻结</text><circle cx="88" cy="298" r="7" fill="#5d83db"/><text x="107" y="304" class="p">投影器：更新</text><circle cx="88" cy="337" r="7" fill="#adb9c9"/><text x="107" y="343" class="p">语言模型：冻结</text>
<rect x="638" y="130" width="510" height="230" rx="22" fill="#fff" stroke="#dce6f4"/><rect x="638" y="130" width="510" height="56" rx="22" fill="#eae6ff"/><text x="664" y="167" class="h">阶段 2 · 监督微调 SFT</text><text x="664" y="219" class="p">继续学习图文问答和回答方式</text><circle cx="674" cy="259" r="7" fill="#adb9c9"/><text x="693" y="265" class="p">视觉编码器：冻结</text><circle cx="674" cy="298" r="7" fill="#856ed1"/><text x="693" y="304" class="p">投影器：更新</text><circle cx="674" cy="337" r="7" fill="#856ed1"/><text x="693" y="343" class="p">语言模型首尾层：更新</text>
<path d="M566 244H626" class="arr"/><rect x="52" y="398" width="1096" height="56" rx="14" fill="#edf5f2"/><text x="75" y="433" class="p">冻结 = 参数不更新；仍然参与前向计算。视觉编码器在这两种默认策略中均被冻结。</text>
</svg>
