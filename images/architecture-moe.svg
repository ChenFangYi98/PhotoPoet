<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><rect width="1200" height="300" rx="20" fill="#f7f9fc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="40" y="53" font-size="28" fill="#17334f" font-weight="700">MindChen MoE 前馈模块</text><rect x="40" y="92" width="250" height="112" rx="16" fill="#dcecff" stroke="#c9d5e3"/><text x="165" y="135" text-anchor="middle" font-size="21" fill="#17334f">隐藏状态</text><text x="165" y="166" text-anchor="middle" font-size="21" fill="#17334f">每个 token 的向量</text><path d="M 297 148 h 24 m -8 -6 l 8 6 -8 6" fill="none" stroke="#506882" stroke-width="3"/><rect x="330" y="92" width="250" height="112" rx="16" fill="#e8e1ff" stroke="#c9d5e3"/><text x="455" y="135" text-anchor="middle" font-size="21" fill="#17334f">Router + Top-K</text><text x="455" y="166" text-anchor="middle" font-size="21" fill="#17334f">选择少量专家</text><path d="M 587 148 h 24 m -8 -6 l 8 6 -8 6" fill="none" stroke="#506882" stroke-width="3"/><rect x="620" y="92" width="250" height="112" rx="16" fill="#def4e9" stroke="#c9d5e3"/><text x="745" y="135" text-anchor="middle" font-size="21" fill="#17334f">专家前馈网络</text><text x="745" y="166" text-anchor="middle" font-size="21" fill="#17334f">仅激活选中专家</text><path d="M 877 148 h 24 m -8 -6 l 8 6 -8 6" fill="none" stroke="#506882" stroke-width="3"/><rect x="910" y="92" width="250" height="112" rx="16" fill="#fff0d7" stroke="#c9d5e3"/><text x="1035" y="135" text-anchor="middle" font-size="21" fill="#17334f">按路由概率加权</text><text x="1035" y="166" text-anchor="middle" font-size="21" fill="#17334f">合并专家输出</text><text x="40" y="255" font-size="18" fill="#526579">MoE 路由参数随模型配置保存；推理时沿用训练时的归一化设置。</text></g></svg>