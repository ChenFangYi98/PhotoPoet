<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><rect width="1200" height="300" rx="20" fill="#f7f9fc"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="40" y="53" font-size="28" fill="#17334f" font-weight="700">图文融合</text><rect x="40" y="92" width="250" height="112" rx="16" fill="#dcecff" stroke="#c9d5e3"/><text x="165" y="135" text-anchor="middle" font-size="21" fill="#17334f">文本 token</text><text x="165" y="166" text-anchor="middle" font-size="21" fill="#17334f">含图像占位符</text><path d="M 297 148 h 24 m -8 -6 l 8 6 -8 6" fill="none" stroke="#506882" stroke-width="3"/><rect x="330" y="92" width="250" height="112" rx="16" fill="#e8e1ff" stroke="#c9d5e3"/><text x="455" y="135" text-anchor="middle" font-size="21" fill="#17334f">Embedding</text><text x="455" y="166" text-anchor="middle" font-size="21" fill="#17334f">将文本转为向量</text><path d="M 587 148 h 24 m -8 -6 l 8 6 -8 6" fill="none" stroke="#506882" stroke-width="3"/><rect x="620" y="92" width="250" height="112" rx="16" fill="#def4e9" stroke="#c9d5e3"/><text x="745" y="135" text-anchor="middle" font-size="21" fill="#17334f">替换占位符向量</text><text x="745" y="166" text-anchor="middle" font-size="21" fill="#17334f">插入图像特征</text><path d="M 877 148 h 24 m -8 -6 l 8 6 -8 6" fill="none" stroke="#506882" stroke-width="3"/><rect x="910" y="92" width="250" height="112" rx="16" fill="#fff0d7" stroke="#c9d5e3"/><text x="1035" y="135" text-anchor="middle" font-size="21" fill="#17334f">共享 Transformer</text><text x="1035" y="166" text-anchor="middle" font-size="21" fill="#17334f">生成回答</text><text x="40" y="255" font-size="18" fill="#526579">图像特征由视觉编码器和投影层产生；不会先转换成图片描述文字。</text></g></svg>